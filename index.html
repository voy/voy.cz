  <script>
    (function () {
      var h = Number(new Intl.DateTimeFormat('en-US', {
        hour: 'numeric', hour12: false, timeZone: 'Europe/Berlin'
      }).format(new Date()));
      document.documentElement.dataset.sky =
        h >= 5 && h < 8   ? 'dawn' :
        h >= 8 && h < 17  ? 'day'  :
        h >= 17 && h < 20 ? 'dusk' : 'night';
    })();
  </script>
  <style>
    @font-face {
      font-family: "Literata";
      font-style: normal;
      font-weight: 400 600;
      font-display: block;
      src: url("fonts/literata-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --skyline-a: #1c2128;
      --skyline-b: #21262d;
      --skyline-c: #252c35;
      --skyline-d: #2d333b;
      --ring:      #3a4250;
      --route:     #7a7872;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
        --skyline-a: #c8d1da;
        --skyline-b: #6e7781;
        --skyline-c: #424a53;
        --skyline-d: #1f2328;
        --ring:      #555d68;
        --route:     #9a9390;
      }
      .window, .clock { display: none; }
    }

    /* Sky tint by Berlin hour — subtle but visible. Route shimmer tracks the sky. */
    @media (prefers-color-scheme: dark) {
      html[data-sky="dawn"]  {
        --bg:    color-mix(in oklab, #0d1117, #ff8a5c 10%);
        --route: color-mix(in oklab, #7a7872, #ff8a5c 25%);
      }
      html[data-sky="day"]   {
        --bg:    color-mix(in oklab, #0d1117, #7ec6ff 7%);
        --route: color-mix(in oklab, #7a7872, #7ec6ff 15%);
      }
      html[data-sky="dusk"]  {
        --bg:    color-mix(in oklab, #0d1117, #8a7dff 10%);
        --route: color-mix(in oklab, #7a7872, #c67aff 20%);
      }
      html[data-sky="night"] { --bg: #0d1117; }
    }

    @media (prefers-color-scheme: light) {
      html[data-sky="dawn"]  {
        --bg:    color-mix(in oklab, #ffffff, #ff8a5c 9%);
        --route: color-mix(in oklab, #9a9390, #ff8a5c 25%);
      }
      html[data-sky="day"]   { --bg: #ffffff; }
      html[data-sky="dusk"]  {
        --bg:    color-mix(in oklab, #ffffff, #8a7dff 9%);
        --route: color-mix(in oklab, #9a9390, #c67aff 20%);
      }
      html[data-sky="night"] {
        --bg:    color-mix(in oklab, #ffffff, #4a5fa8 7%);
        --route: color-mix(in oklab, #9a9390, #4a5fa8 15%);
      }
    }

    body { transition: background-color 1.5s ease; }

    @media (prefers-reduced-motion: reduce) {
      .window, .beacon { animation: none; }
      .route .comet, .route .ping { animation: none; opacity: 0; }
      .route .track { opacity: 0.7; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* ── Main ── */

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 24px;
    }

    h1 {
      font-family: "Literata", Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 7vw, 72px);
      font-weight: 500;
      font-optical-sizing: auto;
      letter-spacing: -0.01em;
      line-height: 1;
      color: var(--text);
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    nav a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      color: var(--accent);
    }

    .tagline {
      margin-top: 14px;
      color: var(--muted);
      font-size: 16px;
    }

    /* ── Status line ── */

    .status {
      margin-top: 10px;
      font-family: ui-monospace, "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Links ── */

    nav {
      margin-top: 32px;
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 14px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    nav a:hover { color: var(--accent); }

    nav .sep {
      color: var(--border);
      user-select: none;
    }

    .status .route {
      display: inline-block;
      vertical-align: middle;
      margin: 0 8px;
      color: var(--route);
    }

    .route .city  { fill: currentColor; opacity: 0.85; }
    .route .track {
      fill: none;
      stroke: currentColor;
      stroke-width: 0.55;
      stroke-linecap: round;
      stroke-dasharray: 1.4 1.3;
      opacity: 0.4;
    }
    /* pathLength=100 with a 114 period keeps exactly one streak on the track */
    .route .comet {
      fill: none;
      stroke: currentColor;
      stroke-width: 0.9;
      stroke-linecap: round;
      stroke-dasharray: 14 100;
      animation: travel 3s ease-in-out infinite alternate;
    }
    .route .ping {
      fill: none;
      stroke: currentColor;
      stroke-width: 0.35;
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: ping 6s ease-out infinite;
    }

    @keyframes travel {
      0%   { stroke-dashoffset: 14;   opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { stroke-dashoffset: -100; opacity: 0; }
    }
    @keyframes ping {
      0%       { opacity: 0.7; transform: scale(0.9); }
      22%      { opacity: 0;   transform: scale(1.7); }
      100%     { opacity: 0; }
    }

    /* ── Skyline details ── */

    .window {
      fill: #ffd27a;
      animation: flicker 7s ease-in-out infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.28; }
      45%      { opacity: 0.45; }
      55%      { opacity: 0.15; }
    }

    .sky-far  { fill: color-mix(in oklab, var(--skyline-a), var(--bg) 40%); }
    .sky-near { fill: color-mix(in oklab, var(--skyline-a), var(--skyline-b) 40%); }
    .pane     { fill: var(--bg); opacity: 0.35; }
    .clock    { fill: #ffd27a; opacity: 0.5; }

    .tw-hi    { stop-color: color-mix(in oklab, var(--skyline-b), white 7%); }
    .tw-b     { stop-color: var(--skyline-b); }
    .tw-lo    { stop-color: color-mix(in oklab, var(--skyline-b), black 18%); }
    .tw-shine { stop-color: color-mix(in oklab, var(--skyline-c), white 14%); }
    .tw-c     { stop-color: var(--skyline-c); }
    .tw-c-lo  { stop-color: color-mix(in oklab, var(--skyline-c), black 22%); }
    .tw-stripe { fill: var(--ring); }
    .tw-band   { fill: color-mix(in oklab, var(--skyline-c), var(--skyline-d) 45%); }

    .beacon {
      fill: #ff6b6b;
      animation: beacon 2.2s ease-in-out infinite;
    }

    .beacon-dim {
      fill: #ff6b6b;
      filter: drop-shadow(0 0 1.5px #ff6b6b);
      animation: beaconDim 4s ease-in-out infinite;
    }

    @keyframes beaconDim {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.55; }
    }

    @keyframes beacon {
      0%, 70%, 100% { opacity: 0.25; }
      35%           { opacity: 1; }
    }

    /* ── Footer ── */

    footer {
      padding: 0 16px;
      display: flex;
      justify-content: center;
    }

    footer svg { display: block; width: 340px; height: 204px; }

    /* ── Mobile ── */

    @media (max-width: 540px) {
      footer svg { width: 140px; height: 84px; }
    }

  </style>
</head>
